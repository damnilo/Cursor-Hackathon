services:
  - type: web
    name: firstcontrib
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      # Must be set in the Render dashboard before the first build (Next inlines NEXT_PUBLIC_*).
      - key: NEXT_PUBLIC_CONVEX_URL
        sync: false
